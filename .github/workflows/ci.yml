# CI: lint, test and build both services on every push and every pull request.
# Pushes to main are tested by the CD workflow instead, which calls this file
# (workflow_call) before deploying, so main is not tested twice and nothing is
# deployed unless all of it passes. Only when called from CD on main are the
# images pushed to GHCR.
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test ${{ matrix.service }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false # one failing service does not hide the other one's result
      matrix:
        service: [customers, lessons]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.9" # the same Python as the Docker images
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt

      # The tests need a real SQL Server, never Azure SQL. This one lives only
      # for this run; its sa password is random and masked in the logs, so no
      # password is written in this file or stored as a secret.
      - name: Start a throwaway SQL Server container
        run: |
          password="Ci$(openssl rand -hex 12)Aa1"
          echo "::add-mask::$password"
          echo "MSSQL_SA_PASSWORD=$password" >> "$GITHUB_ENV"
          docker run -d --name mssql -p 1433:1433 \
            -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$password" \
            mcr.microsoft.com/mssql/server:2022-latest

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Wait until SQL Server accepts logins
        run: |
          for attempt in $(seq 1 30); do
            if docker exec mssql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa \
                 -P "$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker logs mssql
          exit 1

      - name: Test, failing below 70% coverage
        run: pytest --cov --cov-report=term-missing --cov-fail-under=70

  validate:
    name: Validate system.yaml and the OpenAPI documents
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.9"
      - name: Install the validators
        run: pip install check-jsonschema==0.39.0 openapi-spec-validator==0.9.0
      - name: Check system.yaml against the provided system.schema.json
        run: check-jsonschema --schemafile system.schema.json system.yaml
      - name: Check both documents against the OpenAPI specification
        run: openapi-spec-validator services/customers/openapi.yaml services/lessons/openapi.yaml

  build:
    name: Build the ${{ matrix.service }} image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # to push the image to GHCR (only on main)
    strategy:
      fail-fast: false
      matrix:
        service: [customers, lessons]
    env:
      # Only a deploy from main pushes; branches and pull requests just build.
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5

      - name: Image name (GHCR needs lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tutoring-${{ matrix.service }}" >> "$GITHUB_ENV"

      - name: Sign in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # A failed build fails the pipeline. The image is tagged with the commit
      # SHA, so every deploy says exactly which code it runs. provenance: false
      # keeps the image a plain image that Azure Container Apps can pull.
      - name: Build (and on main push) the image
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          push: ${{ env.PUSH == 'true' }}
          provenance: false
