<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} | Tutoring Manager</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('index') }}">Tutoring Manager</a>
    <nav>
      <a href="{{ url_for('lessons.list_lessons') }}"
         {% if request.path.startswith('/lessons') %}aria-current="page"{% endif %}>Lessons</a>
      <a href="{{ url_for('customers.list_students') }}"
         {% if request.path.startswith('/students') %}aria-current="page"{% endif %}>Students</a>
      <a href="{{ url_for('lessons.list_tutors') }}"
         {% if request.path.startswith('/tutors') %}aria-current="page"{% endif %}>Tutors</a>
    </nav>
  </header>

  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <p class="flash flash-{{ category }}" role="status">{{ message }}</p>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
