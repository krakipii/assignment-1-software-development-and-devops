{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<h1>{{ title }}</h1>

<form class="record-form" method="post">
  <label for="name">Name</label>
  <input id="name" name="name" value="{{ tutor.name or '' }}" required maxlength="100">

  <label for="email">Email</label>
  <input id="email" name="email" type="email" value="{{ tutor.email or '' }}">

  <label for="subjects">Subjects</label>
  <input id="subjects" name="subjects" value="{{ tutor.subjects or '' }}">
  <p class="hint">Separate subjects with commas, for example: Maths, Physics. Leave empty if the tutor can teach any subject.</p>

  <label for="hourly_rate">Rate per hour</label>
  <input id="hourly_rate" name="hourly_rate" type="number" min="0" max="1000" step="0.01"
         value="{{ tutor.hourly_rate if tutor.hourly_rate is not none else '' }}" required>

  <div class="form-actions">
    <button type="submit">{{ submit_label }}</button>
    <a href="{{ url_for('lessons.list_tutors') }}">Cancel</a>
  </div>
</form>
{% endblock %}
